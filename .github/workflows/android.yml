name: Android (KolaPass Scan)
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature (secret KEYSTORE_BASE64, facultatif)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signature avec la clé de production."
          else
            echo "::warning::Secret KEYSTORE_BASE64 absent : APK signé avec une clé de test (désinstaller avant chaque mise à jour). Voir docs/DEPLOIEMENT.md."
          fi

      - name: Compilation de l'APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'kolapass' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log; then
            grep -E "^e: |error:|What went wrong|Could not|> " build.log | head -30 | while read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "KolaPassScan-$VERSION_NAME.apk"
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KolaPassScan-${{ env.VERSION_NAME }}
          path: android/KolaPassScan-*.apk

      - name: Publication (release GitHub ; pré-version hors branche principale)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v$VERSION_NAME"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then FLAG="--latest"; else FLAG="--prerelease"; fi
          gh release create "$TAG" "KolaPassScan-$VERSION_NAME.apk" \
            --target "$GITHUB_SHA" \
            --title "KolaPass Scan $VERSION_NAME (Android)" \
            --notes "Application Android des agents de contrôle. Installation : télécharger l'APK sur le téléphone, autoriser « sources inconnues », ouvrir. Configuration : voir docs/DEPLOIEMENT.md." \
            $FLAG
